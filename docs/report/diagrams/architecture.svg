ies</tspan></text><rect x="315" y="536" width="210" height="48" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#212529"><tspan x="420.0" y="564.5">SLA calculator</tspan></text><rect x="315" y="592" width="210" height="48" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#212529"><tspan x="420.0" y="612.5">Duplicate and correlation</tspan><tspan x="420.0" y="628.5">detectors, escalation policy</tspan></text><rect x="315" y="648" width="210" height="48" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#212529"><tspan x="420.0" y="668.5">Entities: User, ITService,</tspan><tspan x="420.0" y="684.5">Category, SLA policy ...</tspan></text><rect x="600" y="424" width="210" height="48" rx="8" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#212529"><tspan x="705.0" y="452.6">Ten SQLite repositories</tspan></text><rect x="600" y="480" width="210" height="48" rx="8" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#212529"><tspan x="705.0" y="500.6">Database, codec,</tspan><tspan x="705.0" y="516.5">schema.sql</tspan></text><rect x="600" y="536" width="210" height="48" rx="8" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#212529"><tspan x="705.0" y="564.5">Demo data seeder</tspan></text><line x1="135" y1="346" x2="135" y2="396" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow)"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="12" text-anchor="start" fill="#495057" fon