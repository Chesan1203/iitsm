 sans-serif" font-size="12.5" text-anchor="middle" fill="#212529"><tspan x="630" y="364.4">Requesting information and the reporter's reply keep the</tspan><tspan x="630" y="380.4">status IN_PROGRESS.</tspan></text><rect x="30" y="400" width="800" height="52" rx="4" fill="#fffbe6" stroke="#997404" stroke-width="1.5" stroke-dasharray="5 3"/><text font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#212529"><tspan x="430" y="422.4">In every open status, with no change of status: add a note, escalate (P1 only), change the priority,</tspan><tspan x="430" y="438.4">flag a possible duplicate, reassign the technician. CLOSED accepts only feedback.</tspan></text></svg>